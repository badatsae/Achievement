name: Build Moa APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack app
        run: unzip -q moa-android-source.zip -d source
      - name: Build APK
        run: gradle -p source/android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: moa-apk
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
